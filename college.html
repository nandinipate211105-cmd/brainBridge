<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Directory | BrainBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg-dark: #0f172a; }
        body { background: var(--bg-dark); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25); background: rgba(255, 255, 255, 0.06); }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1); z-index: 100; }
        .sidebar-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; }
        .nav-blur { backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.85); }
        
        .modal-overlay { backdrop-filter: blur(30px); background: rgba(0,0,0,0.85); transition: 0.3s ease; }
        .hero-img { height: 260px; border-radius: 24px; object-fit: cover; width: 100%; border-bottom: 4px solid var(--primary); }

        input, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        input:focus { border-color: #6366f1 !important; outline: none; }

        /* Scrollbar for Modals */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- SIDEBAR -->
    <div id="sidebarOverlay" class="sidebar-overlay fixed inset-0 z-[90]" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#0f172a] border-r border-white/5 p-6 -translate-x-full z-[100] shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Menu</h2>
            <button onclick="toggleSidebar()"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="space-y-4">
            <a href="dashboard.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-chart-line w-8 text-indigo-400"></i> Dashboard</a>
            <a href="college.html" class="flex items-center p-3 rounded-xl bg-indigo-600/20 text-indigo-400 font-bold"><i class="fa-solid fa-university w-8"></i> Search College</a>
            <a href="team.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-users-gear w-8 text-indigo-400"></i> Team Formation</a>
            <a href="project.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-project-diagram w-8"></i> Event Management</a>

            <a href="communication.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-comments w-8 text-indigo-400"></i> Communication</a>
            <a href="feedback.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-message w-8 text-indigo-400"></i> Feedback</a>
            <hr class="border-white/5 my-4">
            <a href="profile.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-user w-8 text-indigo-400"></i> My Profile</a>
            <button onclick="logout()" class="w-full text-left p-3 text-red-400"><i class="fa-solid fa-right-from-bracket w-8"></i> Logout</button>

        </nav>
    </div>

    <!-- HEADER -->
<!-- HEADER SECTION -->
<header class="fixed top-0 w-full nav-blur z-50 border-b border-white/5">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Left: Logo & Sidebar Toggle -->
        <div class="flex items-center gap-6">
            <button onclick="toggleSidebar()" class="text-2xl hover:text-indigo-400 transition">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <h1 class="text-2xl font-black tracking-tighter">Brain<span class="text-indigo-500">Bridge</span></h1>
        </div>

        <!-- Right: User Profile with Dropdown -->
        <div class="relative group">
            <div class="flex items-center gap-4 cursor-pointer p-1 pr-3 rounded-2xl hover:bg-white/5 transition duration-300">
                <div class="text-right hidden sm:block">
                    <p id="displayUserId" class="text-[10px] font-mono text-indigo-400 font-black uppercase tracking-widest leading-none">ID_0000</p>
                    <p id="displayUserName" class="text-xs font-bold text-white mt-1">Username</p>
                </div>
                
                <div class="relative">
                    <div id="userInitial" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black shadow-lg">U</div>
                    <!-- Small Green Online Dot -->
                    <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-[#0f172a] rounded-full"></div>
                </div>

                <!-- Dropdown Arrow -->
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 group-hover:text-white transition-transform duration-300 group-hover:rotate-180"></i>
            </div>

            <!-- THE DROPDOWN MENU -->
            <div class="absolute right-0 mt-2 w-56 bg-[#131c31] border border-white/10 rounded-2xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible translate-y-2 group-hover:translate-y-0 transition-all duration-300 z-[120] overflow-hidden backdrop-blur-xl">
                <div class="p-4 border-b border-white/5 bg-white/5">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Account Hub</p>
                </div>
                <div class="p-2">
                    <a href="profile.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-indigo-600/20 text-sm font-medium transition group/item">
                        <i class="fa-solid fa-user-circle text-indigo-400 group-hover/item:scale-110 transition"></i>
                        My Profile
                    </a>
                    <a href="setting.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-sm font-medium transition group/item">
                        <i class="fa-solid fa-gear text-slate-400 group-hover/item:rotate-90 transition duration-500"></i>
                        Settings
                    </a>
                </div>
                <div class="p-2 border-t border-white/5 bg-black/20">
                    <button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-red-500/10 text-red-400 text-sm font-bold transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>


    <main class="container mx-auto px-6 pt-32 pb-20">
        
        <!-- TITLE & SEARCH -->
        <div class="flex flex-col lg:flex-row items-center justify-between gap-8 mb-16 pb-12 border-b border-white/5">
            <div>
                <h2 class="text-6xl font-black tracking-tighter mb-4">Ecosystem <span class="text-indigo-500">Hub</span></h2>
                <p class="text-slate-400 font-bold uppercase tracking-widest text-xs flex items-center gap-3">
                    <i class="fa-solid fa-circle text-emerald-500 text-[8px] animate-pulse"></i> 
                    <span id="countDisplay">0</span> Campuses Integrated
                </p>
            </div>
            <div class="w-full lg:w-96 relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="collegeSearch" onkeyup="handleSearch()" placeholder="Search by name or field..." 
                    class="w-full pl-14 pr-6 py-5 rounded-3xl outline-none transition-all text-sm font-semibold shadow-2xl bg-white/5 border-white/10">
            </div>
        </div>

        <div id="collegeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>

        <div id="viewMoreContainer" class="mt-20 text-center">
            <button onclick="showMore()" class="view-more-btn font-black text-xs uppercase tracking-[0.3em] flex items-center gap-4 mx-auto group text-indigo-400">
                <span class="h-[1px] w-12 bg-indigo-500"></span> Load More Campuses <span class="h-[1px] w-12 bg-indigo-500"></span>
            </button>
        </div>
    </main>

    <!-- LAYER 1: COLLEGE MODAL (LIST OF ALL EVENTS) -->
    <div id="collegeModal" class="fixed inset-0 z-[100] modal-overlay hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-3xl w-full p-10 relative max-h-[85vh] overflow-y-auto custom-scroll">
            <button onclick="closeModal('collegeModal')" class="absolute top-8 right-8 text-2xl text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- LAYER 2: EVENT DETAIL MODAL (HERO & DETAILS) -->
    <div id="eventDetailModal" class="fixed inset-0 z-[110] modal-overlay hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-2xl w-full p-0 relative overflow-hidden shadow-2xl border-indigo-500/40">
            <div id="eventDetailContent"></div>
        </div>
    </div>

    <!-- LAYER 3: FINAL REGISTRATION FORM -->
    <div id="regFormModal" class="fixed inset-0 z-[120] backdrop-blur-3xl bg-black/90 hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-10 shadow-2xl border-emerald-500/50">
            <h2 class="text-3xl font-black mb-1">Final Step</h2>
            <p id="regEventTitle" class="text-emerald-400 font-bold text-xs uppercase tracking-widest mb-8">Event Name</p>
            <form onsubmit="finishRegistration(event)" class="space-y-4">
                <input type="text" placeholder="Full Name" required class="w-full p-4 rounded-xl outline-none">
                <input type="text" placeholder="Student ID / PRN" required class="w-full p-4 rounded-xl outline-none">
                <select required class="w-full p-4 rounded-xl outline-none">
                    <option value="">Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-black uppercase tracking-widest mt-4 transition shadow-lg shadow-emerald-500/20">Confirm Participation</button>
                <button type="button" onclick="closeModal('regFormModal')" class="w-full text-slate-500 font-bold text-[10px] uppercase mt-2">Go Back</button>
            </form>
        </div>
    </div>

const API = "https://brainbridge-api.onrender.com";
let globalColleges = []; // Stores the active colleges
let allEcosystemEvents = []; // Stores events from Forge

async function initHub() {
    try {
        // 1. Sync User Header
        const name = localStorage.getItem('sv_user_name') || "Student";
        document.getElementById('displayUserName').innerText = name;
        document.getElementById('displayUserId').innerText = localStorage.getItem('sv_user_id') || "ID_0000";
        document.getElementById('userInitial').innerText = name[0].toUpperCase();

        // 2. Fetch Active Colleges from Users in DB
        const colRes = await fetch(`${API}/api/colleges/active`);
        globalColleges = await colRes.json();
        
        // Update the Campus Counter (Image fix)
        document.getElementById('countDisplay').innerText = globalColleges.length;

        // 3. Fetch all Forge Events to show them inside college modals later
        const eventRes = await fetch(`${API}/api/forge/list?category=event`);
        allEcosystemEvents = await eventRes.json();

        renderColleges();
    } catch (e) {
        console.error("Hub Sync Error:", e);
        document.getElementById('collegeGrid').innerHTML = "<p class='text-red-500'>Backend Unreachable. Is main.py running?</p>";
    }
}

function renderColleges() {
    const grid = document.getElementById('collegeGrid');
    if (globalColleges.length === 0) {
        grid.innerHTML = "<div class='col-span-3 py-20 opacity-40 text-center uppercase font-black text-xs tracking-widest'>No integrated campuses found in DB</div>";
        return;
    }

    grid.innerHTML = globalColleges.map(c => `
        <div class="glass-card p-8 border border-white/5 relative overflow-hidden group">
            <div class="w-16 h-16 bg-indigo-600/20 rounded-3xl flex items-center justify-center text-3xl font-black text-indigo-400 mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                ${c.name[0]}
            </div>
            <h3 class="text-2xl font-black mb-2">${c.name}</h3>
            <p class="text-xs text-slate-500 mb-6 uppercase font-bold tracking-tighter">Verified Integrated Campus</p>
            
            <div class="flex items-center gap-4 mb-8 bg-white/5 p-3 rounded-xl">
                <div class="text-center">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Members</p>
                    <p class="text-lg font-bold">${c.students}</p>
                </div>
            </div>

            <!-- FIX: Added valid onclick and pointer cursor -->
            <button onclick="openCollegeDetails('${c.name}')" 
                    class="bg-indigo-600 hover:bg-indigo-500 w-full py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest transition shadow-lg">
                Know More...
            </button>
        </div>
    `).join('');
}

// FIX: New function to handle "Know More" click
async function openCollegeDetails(collegeName) {
    const modal = document.getElementById('collegeModal');
    const content = document.getElementById('modalContent');
    
    // Filter events from the Forge that belong to this specific college
    const collegeEvents = allEcosystemEvents.filter(ev => ev.organizer.toLowerCase() === collegeName.toLowerCase());

    content.innerHTML = `
        <div class="mb-10">
            <h2 class="text-5xl font-black tracking-tighter">${collegeName}</h2>
            <p class="text-indigo-400 font-black uppercase text-xs mt-2">Active Live Cluster</p>
        </div>
        
        <h4 class="text-xs font-black uppercase text-slate-500 mb-6 tracking-widest">Available Live Events</h4>
        
        <div class="space-y-4">
            ${collegeEvents.length > 0 ? collegeEvents.map(ev => `
                <div class="glass-card p-6 border border-white/5 flex flex-col md:flex-row justify-between items-center gap-6">
                    <div>
                        <h4 class="text-xl font-bold">${ev.title}</h4>
                        <p class="text-[10px] text-indigo-400 font-black uppercase mt-1">FORGE ID: ${ev.id.substring(0,8)}</p>
                    </div>
                    <button onclick="openEventDetail('${ev.id}')" class="bg-indigo-600 px-8 py-3 rounded-xl font-black uppercase text-[10px]">Details & Register</button>
                </div>
            `).join('') : `<p class='opacity-30 italic text-sm'>No live events currently hosted by this campus in the Forge.</p>`}
        </div>
    `;

    modal.classList.remove('hidden');
}

// Function to show the final Registration form for an event
function openEventDetail(eventId) {
    const ev = allEcosystemEvents.find(e => e.id === eventId);
    const detailModal = document.getElementById('eventDetailModal');
    const detailContent = document.getElementById('eventDetailContent');

    detailContent.innerHTML = `
        <div class="p-10">
            <h2 class="text-4xl font-black tracking-tighter mb-4">${ev.title}</h2>
            <div class="bg-white/5 p-6 rounded-2xl border border-white/5 mb-8">
                <p class="text-sm text-slate-300 leading-relaxed italic">"${ev.desc}"</p>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="bg-indigo-600/10 p-4 rounded-xl border border-indigo-500/20">
                    <p class="text-[8px] font-black uppercase text-slate-500">Authority</p>
                    <p class="text-xs font-bold">${ev.organizer}</p>
                </div>
                <div class="bg-emerald-600/10 p-4 rounded-xl border border-emerald-500/20">
                    <p class="text-[8px] font-black uppercase text-slate-500">Access</p>
                    <p class="text-xs font-bold text-emerald-400">Verified</p>
                </div>
            </div>
            <button onclick="openFinalReg('${ev.title}')" class="w-full bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs">Apply Now</button>
        </div>
    `;

    document.getElementById('collegeModal').classList.add('hidden');
    detailModal.classList.remove('hidden');
}

function openFinalReg(title) {
    document.getElementById('regEventTitle').innerText = title;
    document.getElementById('regFormModal').classList.remove('hidden');
}

function finishRegistration(e) {
    e.preventDefault();
    alert("System confirmed! You are registered.");
    closeModal('regFormModal');
    closeModal('eventDetailModal');
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
function logout() { localStorage.clear(); window.location.href = 'signup.html'; }

// Run
window.onload = initHub;
