<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BrainBridge Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg-dark: #02020a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* --- 3D Animated Background --- */
        .glow-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            filter: blur(100px);
            opacity: 0.2;
            z-index: 1;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }
        .glow-1 { top: -10%; left: -5%; background: var(--primary); }
        .glow-2 { bottom: -10%; right: -5%; background: var(--accent); animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.2); }
        }

        /* --- Impact Glassmorphism --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 10;
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: 0.3s;
        }
        input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .btn-impact {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.4);
            transition: 0.3s;
        }
        .btn-impact:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Modal Blur */
        .modal-overlay {
            backdrop-filter: blur(15px);
            background: rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <div class="glow-blob glow-1"></div>
    <div class="glow-blob glow-2"></div>

    <!-- MAIN LOGIN CARD -->
    <div class="glass-card w-full max-w-md p-10 mx-4 opacity-0" id="loginCard">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold tracking-tighter mb-2" style="font-family: 'Clash Display';">
                Student<span class="text-indigo-500">Verse</span>
            </h1>
            <p class="text-slate-400 text-sm">Enter the unified digital ecosystem.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">College Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="email" id="email" required placeholder="name@university.edu" 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl text-sm">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Access Key</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl text-sm">
                </div>
                <div class="flex justify-end mt-2">
                    <button type="button" onclick="toggleModal('forgotModal', true)" 
                            class="text-[11px] font-bold text-indigo-400 hover:text-white transition">
                        Forgot Password?
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full btn-impact py-4 rounded-2xl font-bold uppercase text-xs tracking-widest mt-2">
                Secure Sign In
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <p class="text-slate-400 text-sm">New to the verse? 
                <a href="register.html" class="text-indigo-400 font-bold hover:underline">Register Now</a>
            </p>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="forgotModal" class="fixed inset-0 z-[100] modal-overlay hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-sm w-full p-8 border-t-4 border-indigo-500">
            <h2 class="text-2xl font-bold mb-2" style="font-family: 'Clash Display';">Recover Access</h2>
            <p class="text-slate-400 text-xs mb-6">A verification code will be sent to your email.</p>
            
            <!-- Step 1: Request OTP -->
            <div id="forgotStep1">
                <input type="email" id="resetEmail" placeholder="Your College Email" class="w-full p-4 rounded-2xl text-sm mb-4 outline-none">
                <button onclick="requestOTP()" id="otpBtn" class="w-full bg-indigo-600 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Send Code</button>
            </div>

            <!-- Step 2: Verify & Change -->
            <div id="forgotStep2" class="hidden space-y-4">
                <input type="text" id="inputOTP" placeholder="6-Digit OTP" class="w-full p-4 rounded-2xl text-sm outline-none">
                <input type="password" id="newPass" placeholder="New Access Key" class="w-full p-4 rounded-2xl text-sm outline-none">
                <button onclick="handleReset()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Update Password</button>
            </div>

            <button onclick="toggleModal('forgotModal', false)" class="w-full mt-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Cancel</button>
        </div>
    </div>

    <script>
        // --- ANIMATIONS ---
        window.onload = () => {
            gsap.to("#loginCard", { opacity: 1, y: -20, duration: 1, ease: "power4.out" });
        };

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if(show) {
                modal.classList.remove('hidden');
                gsap.from(modal.querySelector('.glass-card'), { scale: 0.9, opacity: 0, duration: 0.3 });
            } else {
                modal.classList.add('hidden');
            }
        }

        // --- AUTH LOGIC ---
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Verifying...";
            
            try {
                const res = await fetch('https://brainbridge-16ea.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: document.getElementById('email').value, 
                        password: document.getElementById('password').value 
                    })
                });

                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('sv_user_name', data.name);
                    localStorage.setItem('sv_user_id', data.user_id);
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.detail || "Login Failed");
                    btn.innerText = "Secure Sign In";
                }
            } catch (err) {
                alert("System Offline: Check Python Terminal");
                btn.innerText = "Secure Sign In";
            }
        };

        // --- FORGOT PASSWORD LOGIC ---
        async function requestOTP() {
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('otpBtn');
            btn.innerText = "Sending...";
            
                    try {
                        const res = await fetch('https://brainbridge-16ea.onrender.com/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if(res.ok) {
                    document.getElementById('forgotStep1').classList.add('hidden');
                    document.getElementById('forgotStep2').classList.remove('hidden');
                } else { alert("Email not registered"); }
            } catch (e) { alert("Backend Error"); }
            btn.innerText = "Send Code";
        }

        async function handleReset() {
            const payload = {
                email: document.getElementById('resetEmail').value,
                otp: document.getElementById('inputOTP').value,
                new_password: document.getElementById('newPass').value
            };
            try {
                const res = await fetch('https://brainbridge-16ea.onrender.com/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    alert("Password Updated! Please Sign In.");
                    location.reload();
                } else { alert("Invalid OTP or Expired"); }
            } catch (e) { alert("Error updating password"); }
        }
    </script>
</body>
</html>
