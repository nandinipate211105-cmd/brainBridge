<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BrainBridge Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg-dark: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background: radial-gradient(circle at center, #1e1b4b, #0f172a);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* 3D Glassmorphism Card */
        .glass-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        /* Impactful Input Styling */
        .input-group input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            outline: none;
            transform: scale(1.01);
        }

        /* 3D Glow Button */
        .btn-impact {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        .btn-impact:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 30px -10px var(--primary);
            filter: brightness(1.1);
        }

        /* Decorative Background Elements */
        .glow-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.15;
            z-index: 1;
            border-radius: 50%;
        }

        .glow-1 { top: -10%; left: -10%; }
        .glow-2 { bottom: -10%; right: -10%; background: var(--accent); }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="glow-blob glow-1"></div>
    <div class="glow-blob glow-2"></div>

    <!-- BACK TO DASHBOARD BUTTON -->
    <a href="index.html" class="absolute top-10 left-10 flex items-center gap-3 text-slate-400 hover:text-white transition-all duration-300 group z-50 bg-white/5 px-5 py-2.5 rounded-full border border-white/10 hover:bg-white/10">
        <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
        <span class="font-semibold tracking-wide uppercase text-xs">Back to Dashboard</span>
    </a>

    <div class="glass-container w-full max-w-md p-12 mx-4">
        <!-- Logo Area -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter text-white">
                Student<span class="text-indigo-500">Verse</span>
            </h1>
            <p class="text-slate-400 text-sm mt-3 font-medium tracking-wide">Enter the unified digital ecosystem.</p>
        </div>

        <form id="loginForm" class="space-y-8">
            <div class="input-group">
                <label class="block text-[10px] uppercase font-black tracking-[0.2em] text-slate-500 mb-3 ml-1">College Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="email" id="email" required placeholder="name@university.edu" 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl text-sm font-medium">
                </div>
            </div>

            <div class="input-group">
                <label class="block text-[10px] uppercase font-black tracking-[0.2em] text-slate-500 mb-3 ml-1">Access Key</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl text-sm font-medium">
                </div>
            </div>

            <button type="submit" class="w-full btn-impact py-4 rounded-2xl font-black uppercase text-xs tracking-widest text-white mt-4">
                Secure Sign In
            </button>
        </form>

        

        <!-- Form Footer -->
        <div class="mt-10 text-center space-y-6">
            <p class="text-[10px] text-slate-500 leading-relaxed uppercase tracking-wider">
                By continuing, you agree to our <br> 
                <a href="#" class="text-slate-300 hover:text-white underline">Terms</a> and 
                <a href="#" class="text-slate-300 hover:text-white underline">Privacy Policy</a>.
            </p>
            
            <div class="pt-6 border-t border-white/5">
                <p class="text-slate-400 text-sm">New to the verse? 
                    <a href="register.html" class="text-indigo-400 font-extrabold hover:text-indigo-300 transition ml-1 underline underline-offset-4">Register Now</a>
                </p>
            </div>
        </div>
    </div>
    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="fixed inset-0 z-[200] backdrop-blur-3xl bg-black/80 hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-10 border-t-4 border-indigo-500">
            <h2 class="text-3xl font-black mb-2">Recover Access</h2>
            <p class="text-slate-400 text-xs mb-8">We will send a code to your registered email.</p>
            <div id="step1"> 
                <input type="email" id="resetEmail" placeholder="Enter Email" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 mb-4 outline-none">
                <button onclick="requestOTP()" class="w-full bg-indigo-600 py-4 rounded-xl font-bold uppercase text-xs tracking-widest">Send OTP</button>
            </div>

            <div id="step2" class="hidden">
                <input type="text" id="inputOTP" placeholder="6-Digit Code" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 mb-4 outline-none">
                <input type="password" id="newPass" placeholder="New Password" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 mb-4 outline-none">
                <button onclick="confirmReset()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold uppercase text-xs tracking-widest">Update Password</button>
            </div>
        </div>
    </div>
</div>

<script>
async function requestOTP() {
    const email = document.getElementById('resetEmail').value;
    const res = await fetch('http://localhost:8000/api/auth/forgot-password', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email })
    });
    if(res.ok) {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    } else { alert("User not found"); }
}
// Implement confirmReset() similarly to fetch /api/auth/reset-password

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const emailValue = document.getElementById('email').value;
            const passwordValue = document.getElementById('password').value;

            // Simple loading state feedback
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Authenticating...";
            btn.disabled = true;

            try {
                const res = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email: emailValue, 
                        password: passwordValue 
                    })
                });

                const data = await res.json();

                if(res.ok) {
                    localStorage.setItem('sv_user_name', data.name);
                    localStorage.setItem('sv_user_id', data.user_id);
                    localStorage.setItem('sv_user_field', data.field);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Access Denied: ' + (data.detail || "Invalid Credentials"));
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('System Offline: Please ensure the Python backend is active.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
