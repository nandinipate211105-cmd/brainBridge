<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Hub | BrainBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg-dark: #0f172a; }
        body { background: var(--bg-dark); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; transition: 0.3s; }
        .glass-card:hover { border-color: var(--primary); transform: translateY(-3px); background: rgba(255, 255, 255, 0.06); }
        
        #sidebar { transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1); z-index: 100; }
        .sidebar-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; }
        .nav-blur { backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.85); }

        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
        
        /* Smooth Modal Animation */
        .modal-active { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- SIDEBAR -->
    <div id="sidebarOverlay" class="sidebar-overlay fixed inset-0 z-[90]" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#0f172a] border-r border-white/5 p-6 -translate-x-full z-[100] shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Menu</h2>
            <button onclick="toggleSidebar()"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="space-y-3">
            <a href="dashboard.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-chart-line w-8 text-indigo-400"></i> Dashboard</a>
            <a href="college.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-university w-8 text-indigo-400"></i> Search College</a>
            <a href="team.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-users-gear w-8 text-indigo-400"></i> Team Formation</a>
            <a href="project.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-project-diagram w-8"></i> Event Management</a>
            <a href="communication.html" class="flex items-center p-3 rounded-xl bg-indigo-600/20 text-indigo-400 font-bold"><i class="fa-solid fa-comments w-8"></i> Communication</a>
            <a href="feedback.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-message w-8 text-indigo-400"></i> Feedback</a>
            <hr class="border-white/5 my-4">
            <a href="profile.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-user w-8 text-indigo-400"></i> My Profile</a>
            <button onclick="logout()" class="w-full text-left p-3 text-red-400"><i class="fa-solid fa-right-from-bracket w-8"></i> Logout</button>
        </nav>
    </div>



<!-- HEADER SECTION -->
<header class="fixed top-0 w-full nav-blur z-50 border-b border-white/5">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Left: Logo & Sidebar Toggle -->
        <div class="flex items-center gap-6">
            <button onclick="toggleSidebar()" class="text-2xl hover:text-indigo-400 transition">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <h1 class="text-2xl font-black tracking-tighter">Brain<span class="text-indigo-500">Bridge</span></h1>
        </div>

        <!-- Right: User Profile with Dropdown -->
        <div class="relative group">
            <div class="flex items-center gap-4 cursor-pointer p-1 pr-3 rounded-2xl hover:bg-white/5 transition duration-300">
                <div class="text-right hidden sm:block">
                    <p id="displayUserId" class="text-[10px] font-mono text-indigo-400 font-black uppercase tracking-widest leading-none">ID_0000</p>
                    <p id="displayUserName" class="text-xs font-bold text-white mt-1">Username</p>
                </div>
                
                <div class="relative">
                    <div id="userInitial" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black shadow-lg">U</div>
                    <!-- Small Green Online Dot -->
                    <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-[#0f172a] rounded-full"></div>
                </div>

                <!-- Dropdown Arrow -->
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 group-hover:text-white transition-transform duration-300 group-hover:rotate-180"></i>
            </div>

            <!-- THE DROPDOWN MENU -->
            <div class="absolute right-0 mt-2 w-56 bg-[#131c31] border border-white/10 rounded-2xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible translate-y-2 group-hover:translate-y-0 transition-all duration-300 z-[120] overflow-hidden backdrop-blur-xl">
                <div class="p-4 border-b border-white/5 bg-white/5">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Account Hub</p>
                </div>
                <div class="p-2">
                    <a href="profile.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-indigo-600/20 text-sm font-medium transition group/item">
                        <i class="fa-solid fa-user-circle text-indigo-400 group-hover/item:scale-110 transition"></i>
                        My Profile
                    </a>
                    <a href="setting.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-sm font-medium transition group/item">
                        <i class="fa-solid fa-gear text-slate-400 group-hover/item:rotate-90 transition duration-500"></i>
                        Settings
                    </a>
                </div>
                <div class="p-2 border-t border-white/5 bg-black/20">
                    <button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-red-500/10 text-red-400 text-sm font-bold transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>


    <main class="container mx-auto px-6 pt-28 pb-20">
        <div class="flex flex-col lg:flex-row gap-8 min-h-[70vh]">
            
            <!-- LEFT: TEAM WORKSPACES -->
            <div class="w-full lg:w-1/2 space-y-6">
                <h2 class="text-xl font-black tracking-tight uppercase text-slate-500">My Workspaces</h2>
                <div id="teamList" class="space-y-4"></div>
            </div>

            <!-- RIGHT: STUDENT SUGGESTIONS -->
            <div class="w-full lg:w-1/2 space-y-6 lg:border-l border-white/5 lg:pl-8">
                <h2 class="text-xl font-black tracking-tight uppercase text-slate-500">Suggestions</h2>
                <div id="suggestionList" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <!-- TEAM CHAT MODAL -->
    <div id="chatModal" class="fixed inset-0 z-[110] backdrop-blur-xl bg-black/70 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-3xl h-[80vh] flex flex-col overflow-hidden modal-active">
            <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                <div class="flex items-center gap-4 cursor-pointer" onclick="toggleGroupInfo()">
                    <div id="modalTeamIcon" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-black">T</div>
                    <div>
                        <h3 id="modalTeamName" class="font-bold text-lg">Team Name</h3>
                        <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest">Active Thread</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button class="text-slate-400 hover:text-emerald-400 transition"><i class="fa-solid fa-phone"></i></button>
                    <button onclick="closeModal('chatModal')" class="text-slate-400 hover:text-red-400 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div class="flex-1 flex overflow-hidden">
                <div id="chatArea" class="flex-1 p-6 overflow-y-auto chat-scroll space-y-4"></div>
                <div id="groupInfo" class="w-0 overflow-hidden bg-black/30 border-l border-white/5 transition-all duration-300">
                    <div class="p-6 w-64">
                        <h4 class="text-[10px] uppercase font-black text-slate-500 tracking-widest mb-4">Description</h4>
                        <p id="groupDesc" class="text-xs text-slate-400 mb-6"></p>
                        <h4 class="text-[10px] uppercase font-black text-slate-500 tracking-widest mb-4">Squad</h4>
                        <div id="memberList" class="space-y-2 text-xs text-slate-300"></div>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-white/5 border-t border-white/10">
                <div class="flex items-center gap-3 bg-black/20 p-2 rounded-2xl border border-white/5">
                    <button class="p-2 text-slate-500 hover:text-indigo-400"><i class="fa-solid fa-paperclip"></i></button>
                    <button class="p-2 text-slate-500 hover:text-yellow-400"><i class="fa-solid fa-face-smile"></i></button>
                    <input type="text" id="chatInput" placeholder="Message team..." class="flex-1 bg-transparent outline-none text-sm px-2">
                    <button onclick="sendMsg()" class="bg-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center hover:bg-indigo-500 transition"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- STUDENT PROFILE TAB (MODAL) -->
    <div id="studentModal" class="fixed inset-0 z-[120] backdrop-blur-2xl bg-black/80 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg p-10 relative modal-active overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
            <button onclick="closeModal('studentModal')" class="absolute top-6 right-6 text-xl text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="studentModalContent">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
    
    <script>
        const teams = [
            { id: 1, name: "Alpha Coders", event: "SIH 2024", desc: "Blockchain supply chain project.", members: ["Alex", "Rahul", "Sarah"], initials: "AC" },
            { id: 2, name: "Mavericks", event: "Design Hack", desc: "Ecosystem UI redesign.", members: ["Emily", "Jake", "Jordan"], initials: "DM" },
            { id: 3, name: "Tech Titans", event: "Hackathon X", desc: "AI-powered health app.", members: ["Priya", "Vikram", "Anjali"], initials: "TT" }
        ];

        const suggestions = [
            { id: 101, name: "Priya Sharma", college: "IIT Delhi", mutual: 3, skills: ["Python", "AI"], achievements: ["Hack Winner", "Top 1% Coder"], dp: "P" },
            { id: 102, name: "Jake Williams", college: "Stanford", mutual: 0, skills: ["UI/UX", "React"], achievements: ["Designer of the Year"], dp: "J" },
            { id: 103, name: "Samuel Lee", college: "NUS Singapore", mutual: 5, skills: ["Web3", "Solidity"], achievements: ["Blockchain Lead"], dp: "S" },
            { id: 104, name: "Anjali Mehta", college: "IIT Bombay", mutual: 2, skills: ["Data Science", "R"], achievements: ["Data Challenge Winner"], dp: "A" },
            { id: 105, name: "Emily Davis", college: "MIT", mutual: 0, skills: ["Product Design", "Figma"], achievements: ["Design Intern at Google"], dp: "E" },
            { id: 106, name: "Vikram Singh", college: "IIT Kanpur", mutual: 4, skills: ["Cybersecurity", "C++"], achievements: ["Security Researcher"], dp: "V" },
            { id: 107, name: "Sarah Johnson", college: "Harvard", mutual: 1, skills: ["Mobile Dev", "Flutter"], achievements: ["App Published on Play Store"], dp: "S" },
            { id: 108, name: "Alex Kim", college: "KAIST", mutual: 0, skills: ["Robotics", "ROS"], achievements: ["Robotics Competition Winner"], dp: "A" }
        ];

        function init() {
            // Render Teams
            document.getElementById('teamList').innerHTML = teams.map(t => `
                <div class="glass-card p-6 cursor-pointer flex items-center justify-between" onclick="openChat(${t.id})">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 flex items-center justify-center font-black text-indigo-400 border border-indigo-500/20">${t.initials}</div>
                        <div><h3 class="font-bold text-lg">${t.name}</h3><p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">${t.event}</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-700"></i>
                </div>
            `).join('');

            // Render Suggestions
            document.getElementById('suggestionList').innerHTML = suggestions.map(s => `
                <div class="glass-card p-4 flex items-center justify-between cursor-pointer" onclick="openStudentProfile(${s.id})">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white">${s.dp}</div>
                        <div>
                            <h4 class="font-bold text-sm">${s.name}</h4>
                            <p class="text-[10px] text-slate-500 font-bold">${s.mutual > 0 ? s.mutual + ' Mutual Connections' : 'Suggested for you'}</p>
                        </div>
                    </div>
                    <button onclick="toggleConnect(event, this, '${s.name}')" class="bg-white/5 border border-white/10 px-5 py-2 rounded-xl text-xs font-bold hover:bg-indigo-600 transition flex items-center gap-2">
                        Connect
                    </button>
                </div>
            `).join('');
        }

        // --- CONNECT TOGGLE LOGIC ---
        function toggleConnect(event, btn, name) {
            event.stopPropagation(); // Prevent opening the modal when clicking the button
            if (btn.innerText.includes("Connect")) {
                btn.innerHTML = `Pending <i class="fa-solid fa-clock text-[10px]"></i>`;
                btn.classList.remove('bg-white/5', 'hover:bg-indigo-600');
                btn.classList.add('bg-slate-800', 'text-slate-500', 'border-slate-700');
            } else {
                btn.innerHTML = `Connect`;
                btn.classList.add('bg-white/5', 'hover:bg-indigo-600');
                btn.classList.remove('bg-slate-800', 'text-slate-500', 'border-slate-700');
            }
        }

        // --- STUDENT PROFILE MODAL ---
        function openStudentProfile(id) {
            const s = suggestions.find(x => x.id === id);
            const content = document.getElementById('studentModalContent');
            content.innerHTML = `
                <div class="text-center mb-8">
                    <div class="w-20 h-20 rounded-3xl bg-indigo-600 mx-auto flex items-center justify-center text-4xl font-black shadow-2xl mb-4">${s.dp}</div>
                    <h2 class="text-3xl font-black tracking-tighter">${s.name}</h2>
                    <p class="text-indigo-400 font-bold text-xs uppercase tracking-widest">${s.college}</p>
                </div>

                <div class="space-y-6">
                    <div>
                        <h4 class="text-[10px] uppercase font-black text-slate-500 mb-2 tracking-widest">Achievements</h4>
                        <div class="flex flex-wrap gap-2">${s.achievements.map(a => `<span class="bg-amber-500/10 text-amber-500 border border-amber-500/20 px-3 py-1 rounded-lg text-[10px] font-bold">${a}</span>`).join('')}</div>
                    </div>
                    <div>
                        <h4 class="text-[10px] uppercase font-black text-slate-500 mb-2 tracking-widest">Skills</h4>
                        <div class="flex flex-wrap gap-2">${s.skills.map(sk => `<span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-lg text-[10px] font-bold">${sk}</span>`).join('')}</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl text-center">
                        <p class="text-xs text-slate-400 font-bold">${s.mutual > 0 ? s.mutual + ' Mutual Connections within StudentVerse' : 'New Ecosystem Candidate'}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-10">
                    <button class="bg-indigo-600 py-3 rounded-2xl font-black text-xs uppercase tracking-widest">Request Message</button>
                    <button onclick="alert('Connect Request Sent!')" class="bg-white/5 border border-white/10 py-3 rounded-2xl font-black text-xs uppercase tracking-widest">Connect</button>
                </div>
            `;
            document.getElementById('studentModal').classList.remove('hidden');
        }

        // --- CHAT LOGIC ---
        function openChat(id) {
            const t = teams.find(team => team.id === id);
            document.getElementById('modalTeamName').innerText = t.name;
            document.getElementById('modalTeamIcon').innerText = t.initials;
            document.getElementById('groupDesc').innerText = t.desc;
            document.getElementById('memberList').innerHTML = t.members.map(m => `<p>• ${m}</p>`).join('');
            document.getElementById('chatArea').innerHTML = `<div class="flex justify-start"><div class="bg-white/10 p-3 rounded-2xl rounded-tl-none text-sm">Welcome to ${t.name} workspace!</div></div>`;
            document.getElementById('chatModal').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        let socket;
        const myUserId = localStorage.getItem('sv_user_id');
        
        function initRealChat() {
            socket = new WebSocket(`ws://localhost:8000/ws/chat/${myUserId}`);
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                displayMessage(data.from, data.message, "theirs");
            };
        }

        function sendMsg() {
            const input = document.getElementById('chatInput');
            const targetId = "target_user_id_here"; // Get this from the clicked profile
    
            const payload = { target_id: targetId, msg: input.value };
            socket.send(JSON.stringify(payload));
            displayMessage("Me", input.value, "mine");
            input.value = "";
        }
        function displayMessage(sender, text, type) {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML += `
            <div class="flex ${type === 'mine' ? 'justify-end' : 'justify-start'}">
                <div class="${type === 'mine' ? 'bg-indigo-600' : 'bg-white/10'} p-3 rounded-2xl text-sm">
                    <small class="block text-[8px] opacity-50">${sender}</small>
                ${text}
                </div>
            </div>
            `;
        }
        function toggleGroupInfo() { const info = document.getElementById('groupInfo'); info.style.width = info.style.width === '256px' ? '0' : '256px'; }
        
        // --- GLOBAL ---
        const userName = localStorage.getItem('sv_user_name') || "Student";
        document.getElementById('displayUserName').innerText = userName;
        document.getElementById('displayUserId').innerText = localStorage.getItem('sv_user_id') || "ID_0000";
        document.getElementById('userInitial').innerText = userName[0].toUpperCase();
        function toggleSidebar() { 
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sb.classList.toggle('-translate-x-full'); overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }
        function logout() { localStorage.clear(); window.location.href = 'signup.html'; }
        init();
    </script>
</body>
</html>
