    <script>
    const API = "https://brainbridge-api.onrender.com";
    const myId = localStorage.getItem('sv_user_id') || "user_000";
    const myName = localStorage.getItem('sv_user_name') || "Student";

    // 1. STAR RATING LOGIC
    let selectedRating = 0;
    const starContainer = document.getElementById('starContainer');
    const stars = starContainer.querySelectorAll('i');

    stars.forEach((star, index) => {
        star.addEventListener('click', () => {
            selectedRating = index + 1;
            updateStarDisplay(selectedRating);
            document.getElementById('ratingStatus').innerText = "Confirmed: " + selectedRating + " Stars";
        });

        star.addEventListener('mouseover', () => updateStarDisplay(index + 1));
        star.addEventListener('mouseleave', () => updateStarDisplay(selectedRating));
    });

    function updateStarDisplay(val) {
        stars.forEach((s, i) => {
            s.classList.toggle('active', i < val);
            s.style.opacity = i < val ? "1" : "0.3";
        });
    }

    // 2. FEEDBACK SUBMISSION
    document.getElementById('feedbackForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            user_id: myId,
            name: document.getElementById('fbName').value,
            text: document.getElementById('fbText').value,
            stars: selectedRating
        };

        if(selectedRating === 0) return alert("Please select a star rating first!");

        try {
            const res = await fetch(`${API}/api/feedback`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                const toast = document.getElementById('thankYouToast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
                e.target.reset();
                selectedRating = 0;
                updateStarDisplay(0);
            }
        } catch(e) { alert("Ecosystem offline."); }
    };

    // 3. LOAD REAL SUGGESTIONS FROM DB
    async function loadSuggestions() {
        const list = document.getElementById('suggestionList');
        try {
            const res = await fetch(`${API}/api/discover/students?exclude_id=${myId}`);
            const students = await res.json();

            if(students.length === 0) {
                list.innerHTML = "<p class='opacity-30 p-10 text-center uppercase text-xs'>No other lifeforms detected in DB yet.</p>";
                return;
            }

            list.innerHTML = students.map(s => `
                <div class="glass-card p-5 flex items-center justify-between group transition-all" onclick="openStudentModal('${s.user_id}')">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/20 flex items-center justify-center font-black text-indigo-400">
                            ${(s.name || 'U')[0]}
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-sm">${s.name}</h4>
                            <p class="text-[10px] text-slate-500 font-bold">${s.college || 'Universal'}</p>
                        </div>
                    </div>
                    <button onclick="sendConnect(event, '${s.user_id}', '${s.name}')" 
                            class="bg-indigo-600/10 hover:bg-indigo-600 text-indigo-400 hover:text-white border border-indigo-500/30 px-5 py-2 rounded-xl text-xs font-black uppercase transition">
                        Connect
                    </button>
                </div>
            `).join('');

        } catch (e) { list.innerHTML = "<p class='text-red-500 text-xs p-5'>Suggestion service unavailable.</p>"; }
    }

    async function sendConnect(event, targetId, targetName) {
        event.stopPropagation();
        try {
            await fetch(`${API}/api/connections/request`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sender_id: myId, sender_name: myName, receiver_id: targetId })
            });
            alert("TRANSMISSION SUCCESS: Connect request pushed to " + targetName);
        } catch (e) { alert("FAIL: Network disruption."); }
    }

    // Modal data fetching for Priya/Users in Suggestions
    async function openStudentModal(uid) {
        // Find user from existing fetch result or refetch
        // We'll reuse the data already shown for the modal impact
        alert("Pulling encrypted Dossier for student: " + uid);
        document.getElementById('studentModal').classList.remove('hidden');
    }

    // STARTUP
    function logout() { localStorage.clear(); window.location.href = 'signup.html'; }
    window.onload = () => {
        const n = localStorage.getItem('sv_user_name') || "User";
        document.getElementById('displayUserName').innerText = n;
        document.getElementById('displayUserId').innerText = myId;
        document.getElementById('userInitial').innerText = n[0].toUpperCase();
        loadSuggestions();
    }
    </script>
</body>
</html> -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comms Hub | BrainBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg-dark: #02020a; }
        body { background: var(--bg-dark); color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; transition: 0.3s; }
        
        /* 
           LAYER FIXES: Sidebar must be on top (z-index 999) 
        */
        #sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 300px; background: #0f172a; z-index: 1000; transition: transform 0.4s; }
        #sidebar.hidden-sidebar { transform: translateX(-100%); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 900; display: none; backdrop-filter: blur(4px); }
        
        header { position: fixed; top: 0; width: 100%; height: 80px; z-index: 500; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="min-h-screen">

    <!-- OVERLAY (This allows clicking anywhere to close sidebar) -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="hidden-sidebar p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Menu</h2>
            <button onclick="toggleSidebar()" class="text-white text-2xl cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="space-y-4">
            <a href="dashboard.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-chart-line w-8 text-indigo-400"></i> Dashboard</a>
            <a href="college.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-university w-8 text-indigo-400"></i> Search College</a>
            <a href="team.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-users-gear w-8 text-indigo-400"></i> Team Formation</a>
            <a href="project.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-project-diagram w-8"></i> Event Management</a>
            <a href="communication.html" class="flex items-center p-3 rounded-xl bg-indigo-600/20 text-indigo-400 font-bold border border-indigo-500/20"><i class="fa-solid fa-comments w-8"></i> Communication</a>
            <hr class="border-white/5">
            <button onclick="localStorage.clear(); window.location.href='signup.html';" class="w-full text-left p-3 text-red-400 font-bold flex items-center"><i class="fa-solid fa-power-off w-8"></i> Sign Out</button>
        </nav>
    </aside>

    <!-- HEADER -->
    <header class="flex items-center">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <!-- IMPORTANT: BURGER BUTTON -->
                <button onclick="toggleSidebar()" class="text-2xl text-indigo-400 hover:text-white transition cursor-pointer relative z-[600]">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h1 class="text-2xl font-black tracking-tighter">Brain<span class="text-indigo-500">Bridge</span></h1>
            </div>

            <!-- Header Syncing Area -->
            <div class="flex items-center gap-4 bg-white/5 p-2 rounded-2xl border border-white/10">
                <div class="text-right hidden sm:block">
                    <p id="header_id" class="text-[9px] font-mono text-indigo-400 font-black uppercase">ID_0000</p>
                    <p id="header_name" class="text-xs font-bold text-white mt-1 italic">Username</p>
                </div>
                <div id="header_av" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black">?</div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 pt-32 pb-20">
        <div class="flex flex-col lg:flex-row gap-10 min-h-[70vh]">
            
            <div class="w-full lg:w-1/2 space-y-8">
                <h2 class="text-2xl font-black uppercase text-slate-500 mb-6 flex items-center gap-4">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span> Live Candidates
                </h2>
                
                <div id="node_container" class="space-y-4">
                    <div class="p-20 text-center glass-card"><p class="animate-pulse font-bold opacity-30">Pinging Database Frequency...</p></div>
                </div>
            </div>

            <!-- PLACEHOLDER AREA -->
            <div class="w-full lg:w-1/2">
                <div class="glass-card p-12 h-full flex flex-col items-center justify-center text-center opacity-30 sticky top-32">
                    <i class="fa-solid fa-satellite-dish text-6xl mb-6"></i>
                    <h3 class="text-2xl font-black">Transmission Portal</h3>
                    <p class="text-sm">Identify a peer on the left to verify credentials and link profiles.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // GLOBALLY DEFINED FUNCTIONS (MUST BE AT THE TOP)
        function toggleSidebar() {
            console.log("Toggle sidebar clicked");
            const side = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (side.classList.contains('hidden-sidebar')) {
                side.classList.remove('hidden-sidebar');
                overlay.style.display = 'block';
            } else {
                side.classList.add('hidden-sidebar');
                overlay.style.display = 'none';
            }
        }

        // BACKEND FETCH ENGINE
        const API = "https:/brainbridge-16ea.onrender.com";

        async function fetchPeerNodes() {
            // 1. Sync User info from localstorage
            const myId = localStorage.getItem('sv_user_id') || "ID_OFFLINE";
            const myName = localStorage.getItem('sv_user_name') || "Student";
            
            document.getElementById('header_name').innerText = myName;
            document.getElementById('header_id').innerText = myId;
            document.getElementById('header_av').innerText = myName[0].toUpperCase();

            const container = document.getElementById('node_container');
            
            try {
                // Request everyone from DB EXCEPT current logged in user
                const res = await fetch(`${API}/api/discover/students?exclude_id=${myId}`);
                const data = await res.json();

                if (data.length === 0) {
                    container.innerHTML = "<div class='p-12 text-center opacity-40 glass-card uppercase font-black text-xs'>Zero Other Lifeforms Registered Yet.</div>";
                    return;
                }

                container.innerHTML = data.map(u => `
                    <div class="glass-card p-6 flex items-center justify-between group">
                        <div class="flex items-center gap-5">
                            <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center font-black text-2xl shadow-xl shadow-indigo-600/30">${u.name[0]}</div>
                            <div>
                                <h3 class="text-xl font-bold">${u.name}</h3>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${u.college || "Hub Member"}</p>
                            </div>
                        </div>
                        <button onclick="linkUser('${u.user_id}', '${u.name}')" 
                                class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-indigo-600/30 transition">
                            Link Connect
                        </button>
                    </div>
                `).join('');

            } catch (err) {
                container.innerHTML = "<p class='text-red-500 font-bold p-10 text-center glass-card'>FAILED TO CONNECT: Is main.py running on port 8000?</p>";
            }
        }

        async function linkUser(targetId, targetName) {
            alert("SUCCESS: A connection request has been beamed to " + targetName);
            const myId = localStorage.getItem('sv_user_id');
            const myName = localStorage.getItem('sv_user_name');
            // Sending it to DB as a notification
            await fetch(`${API}/api/connections/request`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sender_id: myId, sender_name: myName, receiver_id: targetId })
            });
        }

        // On Load, ping the hub
        window.onload = fetchPeerNodes;
    </script>
</body>
</html>
