<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BrainBridge Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg-dark: #0f172a;
        }

        body {
            background-color: var(--bg-dark);
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        /* High-End Glassmorphism */
        .glass-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Professional Input Styling */
        input, select, textarea {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Fixing the Dropdown Visibility Issue */
        select option {
            background-color: #1e1b4b; 
            color: white;
            padding: 10px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary) !important;
            background: rgba(255, 255, 255, 0.08) !important;
            outline: none;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        /* Skill Chips */
        .skill-tag {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            box-shadow: 0 10px 20px -10px var(--primary);
            transition: all 0.3s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 30px -10px var(--primary);
            filter: brightness(1.1);
        }

        /* Styling for the disabled state to make it look unclickable */
        .btn-primary:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Labels styling */
        label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #94a3b8;
            margin-bottom: 8px;
            display: block;
            margin-left: 4px;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <!-- BACK TO LOGIN -->
    <a href="signup.html" class="inline-flex items-center gap-3 text-slate-400 hover:text-white transition-all mb-10 group bg-white/5 px-5 py-2.5 rounded-full border border-white/10">
        <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
        <span class="text-xs font-bold uppercase tracking-widest">Back to Login</span>
    </a>

    <div class="max-w-5xl mx-auto glass-container p-8 md:p-12 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-600/10 rounded-full blur-3xl"></div>
        
        <header class="mb-12">
            <h2 class="text-4xl font-black tracking-tighter mb-2">Create <span class="text-indigo-500">Identity</span></h2>
            <p class="text-slate-400 font-medium">Join the unified student collaboration ecosystem.</p>
        </header>

        <form id="regForm" class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
            
            <div class="space-y-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="w-8 h-[2px] bg-indigo-500"></span>
                    <h3 class="text-xs font-black uppercase tracking-[0.3em] text-indigo-400">Academic Forge</h3>
                </div>
                
                <div>
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Alex Rivera" required class="w-full p-4 rounded-2xl outline-none">
                </div>
                
                <div>
                    <label>College Email</label>
                    <div class="flex gap-3">
                        <input type="email" id="email" placeholder="name@university.edu" required class="flex-1 p-4 rounded-2xl outline-none">
                        <button type="button" onclick="sendOTP()" id="otpBtn" class="bg-indigo-600 hover:bg-indigo-500 px-6 rounded-2xl text-xs font-bold transition-all whitespace-nowrap">Send OTP</button>
                    </div>
                </div>

                <div id="otpSection" class="hidden">
                    <label class="text-indigo-400">Verification Code</label>
                    <div class="flex gap-3">
                        <input type="text" id="otpInput" placeholder="6-digit code" class="flex-1 p-4 rounded-2xl outline-none border-indigo-500/50">
                        <button type="button" onclick="verifyOTP()" class="bg-emerald-600 hover:bg-emerald-500 px-8 rounded-2xl text-xs font-bold transition-all">Verify</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label>Educational Field</label>
                        <select id="field" onchange="handleFieldChange()" required class="w-full p-4 rounded-2xl outline-none appearance-none cursor-pointer">
                            <option value="">Select Field</option>
                            <option value="BTech">B.Tech Engineering</option>
                            <option value="Medical">Medical (MBBS)</option>
                            <option value="Diploma">Diploma</option>
                            <option value="BCA">BCA / MCA</option>
                            <option value="BSc">B.Sc Science</option>
                        </select>
                    </div>

                    <div id="branchDiv">
                        <label>Branch / Specialization</label>
                        <select id="branch" class="w-full p-4 rounded-2xl outline-none hidden appearance-none cursor-pointer"></select>
                    </div>

                    <div>
                        <label>Year of Study</label>
                        <select id="year" required class="w-full p-4 rounded-2xl outline-none appearance-none cursor-pointer">
                            <option value="">Select Year</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label>College</label>
                        <input type="text" id="college" placeholder="MIT Tech" required class="w-full p-4 rounded-2xl outline-none">
                    </div>
                    <div>
                        <label>University</label>
                        <input type="text" id="university" placeholder="SPPU" required class="w-full p-4 rounded-2xl outline-none">
                    </div>
                </div>

                <div>
                    <label>Ecosystem Password</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full p-4 rounded-2xl outline-none">
                </div>
            </div>

            <div class="space-y-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="w-8 h-[2px] bg-purple-500"></span>
                    <h3 class="text-xs font-black uppercase tracking-[0.3em] text-purple-400">Ecosystem DNA</h3>
                </div>

                <div>
                    <label>Mobile (Optional)</label>
                    <input type="text" id="phone" placeholder="+91 XXXXX XXXXX" class="w-full p-4 rounded-2xl outline-none">
                </div>

                <div>
                    <label>Professional Bio</label>
                    <textarea id="bio" rows="4" placeholder="Tell the ecosystem what you're building..." class="w-full p-4 rounded-2xl outline-none resize-none"></textarea>
                </div>

                <div>
                    <label>Skills & Expertise</label>
                    <input type="text" id="skillsInput" placeholder="Type skill (e.g. React) and press Enter" class="w-full p-4 rounded-2xl outline-none">
                    <div id="skillsContainer" class="flex flex-wrap gap-3 mt-4"></div>
                </div>
            </div>

            <div class="md:col-span-2 mt-8">
                <!-- THE BUTTON -->
                <button type="submit" id="submitBtn" disabled class="w-full btn-primary py-5 rounded-2xl font-black uppercase tracking-[0.2em] text-sm transition-all shadow-2xl">
                    Register (Verify Email First)
                </button>
            </div>
        </form>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden flex items-center justify-center z-[100] p-4">
        <div class="glass-container max-w-sm w-full p-10 text-center border-indigo-500/50 shadow-2xl">
            <div class="w-20 h-20 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-6 shadow-lg">🚀</div>
            <h2 class="text-2xl font-black mb-2">Welcome to the Verse</h2>
            <p class="text-slate-400 text-sm mb-6">Your unique AI-generated ID is:</p>
            <div id="generatedId" class="text-2xl font-mono text-indigo-400 bg-white/5 py-3 rounded-xl mb-8 border border-white/10 tracking-widest uppercase"></div>
            <button onclick="window.location.href='signup.html'" class="w-full btn-primary py-3 rounded-xl font-bold uppercase text-xs tracking-widest">Access Dashboard</button>
        </div>
    </div>

    <script>
        let isVerified = false;
        let skills = [];
        const API_URL = "http://localhost:8000";

        async function sendOTP() {
            const email = document.getElementById('email').value;
            const btn = document.getElementById('otpBtn');
            if (!email.includes('@')) return alert('Valid email required!');
            btn.innerText = "Sending..."; btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/send-otp`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (res.ok) {
                    document.getElementById('otpSection').classList.remove('hidden');
                    alert('OTP Sent! Check your Python console.');
                    btn.innerText = "Resend";
                }
            } catch (err) { alert('Backend offline!'); }
            btn.disabled = false;
        }

        async function verifyOTP() {
            const email = document.getElementById('email').value;
            const otp = document.getElementById('otpInput').value;
            try {
                const res = await fetch(`${API_URL}/verify-otp`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                if (res.ok) {
                    isVerified = true;
                    const sb = document.getElementById('submitBtn');
                    
                    // UNLOCKING THE BUTTON
                    sb.disabled = false; 
                    sb.innerText = "Complete Registration";
                    
                    document.getElementById('otpSection').classList.add('hidden');
                    alert('Identity Verified! You can now register.');
                } else { alert('Invalid OTP'); }
            } catch (err) { alert('Verification error'); }
        }

        function handleFieldChange() {
            const field = document.getElementById('field').value;
            const yearSelect = document.getElementById('year');
            const branchSelect = document.getElementById('branch');
            yearSelect.innerHTML = '<option value="">Select Year</option>';
            let maxYears = 3;

            if (field === 'BTech') {
                maxYears = 4;
                showBranch(['CSE', 'IT', 'AI & DS', 'Mechanical', 'Civil', 'ECE']);
            } else if (field === 'Medical') {
                maxYears = 5;
                branchSelect.classList.add('hidden');
            } else if (field === 'Diploma') {
                maxYears = 3;
                showBranch(['Mechanical', 'Electrical', 'Computer']);
            } else { branchSelect.classList.add('hidden'); }

            for (let i = 1; i <= maxYears; i++) {
                yearSelect.innerHTML += `<option value="${i}">Year ${i}</option>`;
            }
        }

        function showBranch(options) {
            const bs = document.getElementById('branch');
            bs.classList.remove('hidden');
            bs.innerHTML = '<option value="">Select Branch</option>';
            options.forEach(opt => { bs.innerHTML += `<option value="${opt}">${opt}</option>`; });
        }

        document.getElementById('skillsInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = e.target.value.trim();
                if (val && !skills.includes(val)) {
                    skills.push(val);
                    const tag = document.createElement('span');
                    tag.className = 'skill-tag';
                    tag.innerHTML = `${val} <i class="fa-solid fa-xmark cursor-pointer" onclick="this.parentElement.remove()"></i>`;
                    document.getElementById('skillsContainer').appendChild(tag);
                    e.target.value = '';
                }
            }
        });

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!isVerified) return alert('Verify OTP first!');

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                field: document.getElementById('field').value,
                branch: document.getElementById('branch').value || "N/A",
                year: parseInt(document.getElementById('year').value),
                college: document.getElementById('college').value,
                university: document.getElementById('university').value,
                phone: document.getElementById('phone').value || "",
                bio: document.getElementById('bio').value || "",
                skills: skills
            };

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('generatedId').innerText = data.user_id;
                    document.getElementById('successModal').classList.remove('hidden');
                } else {
                    const err = await res.json();
                    alert('Registration Failed: ' + (err.detail || 'Error'));
                }
            } catch (err) { alert('Connection Error'); }
        };
    </script>
</body>
</html>
