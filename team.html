<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Hub | BrainBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg-dark: #02020a; }
        body { background: var(--bg-dark); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; transition: 0.3s ease; }
        .glass-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.2); }
        
        /* FIX: Increased z-index to stay above header */
        #sidebar { transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1); z-index: 200; }
        .sidebar-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; z-index: 150; }
        
        .nav-blur { backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.85); z-index: 100; }
        
        input, textarea { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        input:focus, textarea:focus { border-color: var(--primary) !important; outline: none; }

        #successPopup { 
            transform: scale(0.5); 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 300;
        }
        #successPopup.active { transform: scale(1); opacity: 1; pointer-events: auto; }
        
        .expand-section { transition: all 0.4s ease; max-height: 0; overflow: hidden; opacity: 0; }
        .expand-section.show { max-height: 200px; opacity: 1; margin-top: 1rem; }
    </style>
    <script src="https://meet.jit.si/external_api.js"></script>
</head>
<body class="min-h-screen">

    <!-- SIDEBAR -->
    <div id="sidebarOverlay" class="sidebar-overlay fixed inset-0" onclick="toggleSidebar()"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#0f172a] border-r border-white/5 p-6 -translate-x-full shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Menu</h2>
            <button onclick="toggleSidebar()" class="hover:text-indigo-400"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="space-y-3">
            <a href="dashboard.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-chart-line w-8 text-indigo-400"></i> Dashboard</a>
            <a href="college.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-university w-8 text-indigo-400"></i> Search College</a>
            <a href="team.html" class="flex items-center p-3 rounded-xl bg-indigo-600/20 text-indigo-400 font-bold border border-indigo-500/20"><i class="fa-solid fa-users-gear w-8"></i> Team Formation</a>
            <a href="project.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-project-diagram w-8"></i> Event Management</a>
            <a href="communication.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-comments w-8 text-indigo-400"></i> Communication</a>            
            <a href="feedback.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-message w-8 text-indigo-400"></i> Feedback</a>
            <hr class="border-white/5 my-4">
            <a href="profile.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-user w-8 text-indigo-400"></i> My Profile</a>
            <button onclick="logout()" class="w-full text-left flex items-center p-3 rounded-xl hover:bg-red-600/20 transition text-red-400"><i class="fa-solid fa-right-from-bracket w-8"></i> Logout</button>
        </nav>
    </aside>

    <!-- HEADER -->
    <header class="fixed top-0 w-full nav-blur border-b border-white/5 h-20">
        <div class="container mx-auto h-full px-6 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <!-- Fix: Added hover for visibility -->
                <button onclick="toggleSidebar()" class="text-2xl hover:text-indigo-400 transition cursor-pointer relative z-[110]">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h1 class="text-2xl font-black tracking-tighter">Brain<span class="text-indigo-500">Bridge</span></h1>
            </div>
            
            <div class="flex items-center gap-4 group cursor-pointer relative">
                <div class="text-right">
                    <p id="displayUserId" class="text-[9px] font-mono text-indigo-400 uppercase tracking-tighter">ID_0000</p>
                    <p id="displayUserName" class="text-sm font-bold leading-tight">Student Name</p>
                </div>
                <div id="userInitial" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black shadow-lg">S</div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 pt-32 pb-20">
        <div class="flex flex-col lg:flex-row gap-10 items-start">
            
            <!-- LEFT: TEAM LIST -->
            <div class="w-full lg:w-[65%] space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black">Active <span class="text-indigo-500">Squads</span></h2>
                    <div class="relative w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="text" id="teamSearch" onkeyup="filterTeams()" placeholder="Search teams..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs">
                    </div>
                </div>
                <div id="teamGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-20 text-center col-span-2"><p class="animate-pulse text-slate-500 font-bold uppercase tracking-widest text-xs">Pinging Ecosystem Servers...</p></div>
                </div>
            </div>

            <!-- RIGHT: CREATE TEAM -->
            <div class="w-full lg:w-[35%] lg:sticky lg:top-32">
                <div class="glass-card p-8 border-l-4 border-indigo-600 shadow-2xl">
                    <h3 class="text-xl font-black mb-6 flex items-center gap-3">
                        <i class="fa-solid fa-rocket text-indigo-500"></i> Launch Squad
                    </h3>
                    <form id="createTeamForm" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-500 uppercase px-1">Squad Identity</label>
                            <input type="text" id="newTeamName" placeholder="Enter name" required class="w-full p-4 rounded-xl text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-500 uppercase px-1">Target Mission</label>
                            <input type="text" id="newEventName" placeholder="e.g. Smart India Hackathon" required class="w-full p-4 rounded-xl text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-500 uppercase px-1">Technical Stack Needs</label>
                            <textarea id="newRequirements" placeholder="e.g. Python, Flutter, ML..." required class="w-full p-4 rounded-xl h-24 text-sm"></textarea>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[9px] uppercase font-black text-slate-500 mb-1 block">Squad Limit</label>
                                <input type="number" id="newSize" min="2" max="10" value="4" class="w-full p-4 rounded-xl">
                            </div>
                            <div class="flex items-end pb-1">
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg shadow-indigo-600/30 transition-all">Launch 🚀</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- SUCCESS POPUP -->
    <div id="successPopup" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="glass-card p-12 text-center border-indigo-500 border-2 max-w-sm">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-6 shadow-glow"><i class="fa-solid fa-check"></i></div>
            <h2 class="text-3xl font-black mb-2 tracking-tighter">System Updated</h2>
            <p class="opacity-60 text-sm mb-8">Squad launched successfully and added to the Global Ecosystem hub.</p>
            <button onclick="document.getElementById('successPopup').classList.remove('active')" class="w-full bg-indigo-600 py-3 rounded-xl font-bold uppercase text-[10px]">Acknowledge</button>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="teamModal" class="fixed inset-0 backdrop-blur-2xl bg-black/80 hidden flex items-center justify-center z-[250] p-4">
        <div class="glass-card max-w-2xl w-full relative border-t-8 border-indigo-600 overflow-hidden shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-xl text-slate-500 hover:text-white transition cursor-pointer z-50"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent" class="p-10 max-h-[85vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        const myName = localStorage.getItem('sv_user_name') || "Nandini Pate";
        const myId = localStorage.getItem('sv_user_id') || "ID_0000";

        let globalTeams = [];

        function syncUI() {
            document.getElementById('displayUserName').innerText = myName;
            document.getElementById('displayUserId').innerText = myId;
            document.getElementById('userInitial').innerText = myName[0].toUpperCase();
        }

        async function fetchTeams() {
            const grid = document.getElementById('teamGrid');
            try {
                const res = await fetch(`${API}/api/teams/list`);
                globalTeams = await res.json();
                
                if (globalTeams.length === 0) {
                    grid.innerHTML = "<div class='glass-card p-20 col-span-2 text-center opacity-40 font-black uppercase text-xs tracking-[0.2em]'>No Teams Found in Local Hive</div>";
                    return;
                }

                grid.innerHTML = globalTeams.map(t => `
                    <div class="glass-card p-6 border border-white/10 hover:border-indigo-500/50 cursor-pointer transition-all group" onclick="openModal('${t.id}')">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-[10px] font-black bg-indigo-600/10 border border-indigo-500/20 px-3 py-1 rounded-full text-indigo-400 uppercase tracking-widest">${t.college || 'Ecosystem Verified'}</span>
                            <i class="fa-solid fa-arrow-right-long opacity-0 group-hover:opacity-100 group-hover:translate-x-2 transition-all"></i>
                        </div>
                        <h4 class="text-2xl font-black mb-1">${t.name}</h4>
                        <p class="text-xs text-indigo-400 font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-trophy"></i> ${t.event}</p>
                        <p class="text-[11px] text-slate-500 mb-6 italic leading-relaxed line-clamp-2">"${t.req}"</p>
                        <div class="h-[1px] w-full bg-white/5 mb-4"></div>
                        <div class="text-[9px] font-black uppercase text-indigo-500 tracking-widest flex items-center justify-between">
                            <span>Creator: ${t.creator_id}</span>
                            <span class="text-emerald-400">Apply Vacancy →</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) { grid.innerHTML = "<p class='text-rose-500 text-center font-bold'>OFFLINE ERROR: Connection refused to main.py</p>"; }
        }

        function openModal(teamId) {
            const t = globalTeams.find(x => x.id === teamId);
            if (!t) return;
            
            document.getElementById('modalContent').innerHTML = `
                <div class="mb-8">
                    <span class="text-xs font-black uppercase text-indigo-400 tracking-widest">${t.event} Mission</span>
                    <h2 class="text-5xl font-black tracking-tighter mt-1 mb-2">${t.name}</h2>
                    <p class="text-slate-500 font-medium">Formed at ${t.college || 'Verified Campus Hub'}</p>
                </div>

                <div class="bg-indigo-600/5 border border-indigo-500/20 p-6 rounded-3xl mb-8">
                    <p class="text-[10px] uppercase font-black text-indigo-400 tracking-widest mb-2">Requirements / Tech Stack</p>
                    <p class="text-sm text-slate-300 leading-relaxed italic">"${t.req}"</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-10">
                    <div class="bg-white/5 p-4 rounded-2xl">
                        <p class="text-[9px] font-black uppercase text-slate-500">Mission Lead</p>
                        <p class="font-bold text-indigo-400">${t.creator_id}</p>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl">
                        <p class="text-[9px] font-black uppercase text-slate-500">Group Limit</p>
                        <p class="font-bold text-emerald-400">${t.total_size || 'Unknown'} Seats</p>
                    </div>
                </div>

                <button onclick="applyTo('${t.id}', '${t.creator_id}', '${t.name}')" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-black uppercase tracking-widest shadow-2xl hover:scale-[1.02] transition-all">Connect to this Squad</button>
                <button onclick="closeModal()" class="w-full mt-4 text-[10px] font-black text-slate-600 hover:text-slate-400 uppercase tracking-[0.2em] transition">Discard Inquiry</button>
            `;
            document.getElementById('teamModal').classList.remove('hidden');
        }

        async function applyTo(t_id, c_id, t_name) {
            try {
                await fetch(`${API}/api/teams/apply`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ team_id: t_id, creator_id: c_id, user_id: myId, user_name: myName, team_name: t_name })
                });
                alert("APPLICATION LOGGED: Lead " + c_id + " will receive your dossier.");
                closeModal();
            } catch (e) { alert("FAIL: Application upload crashed."); }
        }

        document.getElementById('createTeamForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                creator_id: myId,
                name: document.getElementById('newTeamName').value,
                event: document.getElementById('newEventName').value,
                req: document.getElementById('newRequirements').value,
                college: document.getElementById('displayUserId').parentElement.nextElementSibling ? 'Campus X' : 'Ecosystem Platform', // Simplified
                total_size: parseInt(document.getElementById('newSize').value)
            };
            try {
                const res = await fetch(`${API}/api/teams/create`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    document.getElementById('successPopup').classList.add('active');
                    e.target.reset(); fetchTeams();
                }
            } catch(e) { alert("TERMINAL ERROR: main.py not accepting requests."); }
        };

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sb.classList.toggle('-translate-x-full');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }
        function closeModal() { document.getElementById('teamModal').classList.add('hidden'); }
        function logout() { localStorage.clear(); window.location.href = 'signup.html'; }
        
        syncUI();
        fetchTeams();
    </script>
</body>
</html>
