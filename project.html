<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Forge | BrainBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg-dark: #02020a; }
        body { background: var(--bg-dark); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        /* Fixed clickable layers */
        .nav-blur { backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.85); z-index: 50; }
        #sidebar { z-index: 200; transition: transform 0.4s ease; }
        #sidebarOverlay { z-index: 150; display: none; }
        
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; transition: 0.4s; }
        .glass-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.3); }

        .forge-tab.active { color: #6366f1; border-bottom: 2px solid #6366f1; }
        input, textarea, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        
        /* Floating Button - High Z-Index */
        .btn-forge { position: fixed; bottom: 40px; right: 40px; z-index: 100; cursor: pointer !important; }
        
        /* Terminal Styling */
        #terminalModal { z-index: 300; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- SIDEBAR -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60" onclick="toggleSidebar()"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#0f172a] border-r border-white/5 p-6 -translate-x-full shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Menu</h2>
            <button onclick="toggleSidebar()"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="space-y-3">
            <a href="dashboard.html" class="flex items-center p-3 rounded-lg hover:bg-indigo-600/20 transition group">
                <i class="fa-solid fa-chart-line w-8 text-indigo-400 group-hover:scale-125 transition"></i> Dashboard
            </a>
            <a href="college.html" class="flex items-center p-3 rounded-lg hover:bg-indigo-600/20 transition">
                <i class="fa-solid fa-university w-8 text-indigo-400"></i> Search College
            </a>
            <a href="team.html" class="flex items-center p-3 rounded-lg hover:bg-indigo-600/20 transition">
                <i class="fa-solid fa-users-gear w-8 text-indigo-400"></i> Team Formation
            </a>
            <a href="project.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-project-diagram w-8"></i> Event Management</a>

            <a href="communication.html" class="flex items-center p-3 rounded-lg hover:bg-indigo-600/20 transition">
                <i class="fa-solid fa-comments w-8 text-indigo-400"></i> Communication
            </a>
            <a href="feedback.html" class="flex items-center p-3 rounded-xl hover:bg-white/5 transition"><i class="fa-solid fa-message w-8 text-indigo-400"></i> Feedback</a>
            <div class="pt-10 mt-10 border-t border-slate-800 space-y-4">
                <a href="profile.html" class="flex items-center p-3 rounded-lg hover:bg-indigo-600/20 transition">
                    <i class="fa-solid fa-user w-8 text-indigo-400"></i> Profile
                </a>
                <a href="signup.html" class="flex items-center p-3 rounded-lg hover:bg-red-500/20 text-red-400 transition">
                    <i class="fa-solid fa-right-from-bracket w-8"></i> Logout
                </a>
            </div>
        </nav>
    </aside>

    <!-- HEADER -->
<!-- HEADER: RESTORED NAME + ID AT TOP RIGHT -->
<header class="fixed top-0 w-full nav-blur z-50 border-b border-white/5">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Left Section -->
        <div class="flex items-center gap-6">
            <button onclick="toggleSidebar()" class="text-2xl hover:text-indigo-400 transition">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <h1 class="text-2xl font-black tracking-tighter">Brain<span class="text-indigo-500">Bridge</span></h1>
        </div>

        <!-- Right Section: This "relative group" wraps everything needed for the dropdown -->
        <div class="relative group">
            <div class="flex items-center gap-4 cursor-pointer py-1">
                <!-- User Info -->
                <div class="text-right hidden sm:block">
                    <p id="headerUserId" class="text-[10px] font-mono text-indigo-400 font-black uppercase tracking-widest leading-none">ID_000</p>
                    <p id="headerUserName" class="text-xs font-bold text-white mt-1">Verified Student</p>
                </div>
                
                <!-- Avatar -->
                <div id="headerAvatar" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-black shadow-lg">U</div>                
                
                <!-- Dropdown Arrow -->
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 transition-transform duration-300 group-hover:rotate-180 group-hover:text-white"></i>
            </div>

            <!-- THE DROPDOWN MENU (Now inside the group) -->
            <div class="absolute right-0 mt-2 w-56 bg-[#131c31] border border-white/10 rounded-2xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible translate-y-2 group-hover:translate-y-0 transition-all duration-300 z-[120] overflow-hidden backdrop-blur-xl">
                <div class="p-4 border-b border-white/5 bg-white/5">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Account Hub</p>
                </div>
                <div class="p-2">
                    <a href="profile.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-indigo-600/20 text-sm font-medium transition group/item">
                        <i class="fa-solid fa-user-circle text-indigo-400 group-hover/item:scale-110 transition"></i>
                        My Profile
                    </a>
                    <a href="setting.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-sm font-medium transition group/item">
                        <i class="fa-solid fa-gear text-slate-400 group-hover/item:rotate-90 transition duration-500"></i>
                        Settings
                    </a>
                </div>
                <div class="p-2 border-t border-white/5 bg-black/20">
                    <button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-red-500/10 text-red-400 text-sm font-bold transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

    <!-- THE FLOATING ACTION BUTTON (FORGE ENTRY) -->
    <button onclick="openTerminal()" class="btn-forge bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-5 rounded-3xl shadow-[0_20px_40px_rgba(99,102,241,0.4)] flex items-center gap-4 transition-all active:scale-95 group">
        <i class="fa-solid fa-wand-magic-sparkles group-hover:rotate-45 transition-all"></i>
        <span class="font-black uppercase text-xs tracking-widest">Forge Entry</span>
    </button>

    <main class="container mx-auto px-6 pt-32">
        <div class="flex flex-col lg:flex-row items-center justify-between gap-8 mb-16">
            <div>
                <h2 class="text-5xl font-black tracking-tighter">Ecosystem <span class="text-indigo-500">Forge</span></h2>
                <p class="text-slate-400 font-bold uppercase tracking-[0.2em] text-[10px] mt-2">Connecting global campus visionaries</p>
            </div>
            <div class="glass-card p-2 flex gap-4 bg-white/5">
                <button onclick="switchCategory('event')" id="cat-event" class="forge-tab active px-6 py-2 font-black uppercase text-[10px] tracking-widest">Events</button>
                <button onclick="switchCategory('update')" id="cat-update" class="forge-tab px-6 py-2 font-black uppercase text-[10px] tracking-widest">News</button>
            </div>
        </div>

        <!-- MAIN DATA GRID -->
        <div id="forgeGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
            <!-- Data will load here from MongoDB -->
            <p class="animate-pulse col-span-3 text-center py-20 text-slate-500 uppercase tracking-widest font-black text-xs">Pinging Data Hub...</p>
        </div>
    </main>

    <!-- MODAL: TERMINAL -->
    <div id="terminalModal" class="fixed inset-0 backdrop-blur-3xl bg-black/80 hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-2xl w-full p-10 border-t-8 border-indigo-600">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black tracking-tighter">System <span class="text-indigo-500">Entry</span></h2>
                <button onclick="closeModal('terminalModal')"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="forgeForm" onsubmit="handleForgeSubmit(event)" class="space-y-4">
                <input type="hidden" id="subMode" value="event">
                <div class="space-y-1">
                    <label class="text-[9px] uppercase font-black text-slate-500">Entry Identity (Title)</label>
                    <input type="text" id="f_title" required class="w-full p-4 rounded-xl text-sm" placeholder="e.g. Cybersecurity 101">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] uppercase font-black text-slate-500">Information Payload (Description)</label>
                    <textarea id="f_desc" required class="w-full p-4 rounded-xl text-sm h-32" placeholder="Tell everyone what this is about..."></textarea>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] uppercase font-black text-slate-500">Source (Organizer/College)</label>
                    <input type="text" id="f_org" required class="w-full p-4 rounded-xl text-sm" placeholder="Your College Name">
                </div>
                
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 mt-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl transition">
                    Execute Post Hub Execution 🚀
                </button>
            </form>
        </div>
    </div>

    <script>
        const API = "https://brainbridge-16ea.onrender.com";
        let currentCategory = 'event';

        async function renderGrid() {
            const grid = document.getElementById('forgeGrid');
            try {
                const res = await fetch(`${API}/api/forge/list?category=${currentCategory}`);
                const data = await res.json();
                
                if(data.length === 0) {
                    grid.innerHTML = "<div class='col-span-3 py-20 text-center opacity-30 uppercase font-black tracking-[0.3em] text-xs'>Zero Records Found In Category: " + currentCategory + "</div>";
                    return;
                }

                grid.innerHTML = data.map(item => `
                    <div class="glass-card p-8 border border-white/5 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-4">
                            <span class="text-[8px] font-black px-3 py-1 bg-white/5 border border-white/10 rounded-full">${currentCategory.toUpperCase()}</span>
                        </div>
                        <span class="text-indigo-400 text-[10px] font-black uppercase tracking-widest block mb-2">${item.organizer}</span>
                        <h3 class="text-2xl font-black mb-3 tracking-tight group-hover:text-indigo-400 transition-all">${item.title}</h3>
                        <p class="text-sm text-slate-400 line-clamp-3 leading-relaxed">"${item.desc}"</p>
                        <div class="mt-6 h-[1px] bg-white/5"></div>
                        <div class="mt-4 flex justify-between items-center text-[9px] font-black uppercase text-slate-600">
                            <span>Status: Verified</span>
                            <span class="text-indigo-500">Live Post</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) { grid.innerHTML = "<p class='text-red-500 col-span-3 text-center'>BACKEND OFFLINE</p>"; }
        }

        async function handleForgeSubmit(e) {
            e.preventDefault();
            const payload = {
                type: currentCategory,
                title: document.getElementById('f_title').value,
                desc: document.getElementById('f_desc').value,
                organizer: document.getElementById('f_org').value
            };

            const res = await fetch(`${API}/api/forge/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("ENTRY EXECUTED: Your " + currentCategory + " is now live for all Students.");
                e.target.reset();
                closeModal('terminalModal');
                renderGrid();
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.forge-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`cat-${cat}`).classList.add('active');
            renderGrid();
        }

        function openTerminal() { 
            document.getElementById('terminalModal').classList.remove('hidden'); 
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            const overlay = document.getElementById('sidebarOverlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function logout() { localStorage.clear(); window.location.href = 'signup.html'; }
        
        const myName = localStorage.getItem('sv_user_name') || "N";
        document.getElementById('h_avatar').innerText = myName[0];
        
        renderGrid();
    </script>
</body>
</html>
